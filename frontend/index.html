<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SafeState operating system resource management dashboard">
  <title>SafeState | Resource Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: { ink: '#07111f', panel: '#0d1a2c', blue: '#4f9cff', violet: '#8b7cff' }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.30.3/dist/cytoscape.min.js"></script>
</head>
<body>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="shield-check"></i></div>
        <div class="brand-copy"><strong>Safe<span>State</span></strong><small>RESOURCE INTELLIGENCE</small></div>
        <button id="sidebar-close" class="icon-button mobile-only" aria-label="Close navigation"><i data-lucide="x"></i></button>
      </div>
      <nav class="nav-groups" aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <a class="nav-link" data-route="dashboard" href="#dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a class="nav-link" data-route="processes" href="#processes"><i data-lucide="cpu"></i><span>Processes</span></a>
        <a class="nav-link" data-route="resources" href="#resources"><i data-lucide="database"></i><span>Resources</span></a>
        <a class="nav-link" data-route="allocation" href="#allocation"><i data-lucide="arrow-left-right"></i><span>Resource Allocation</span></a>
        <a class="nav-link" data-route="scheduling" href="#scheduling"><i data-lucide="gantt-chart"></i><span>CPU Scheduling</span></a>
        <p class="nav-label">Analysis</p>
        <a class="nav-link" data-route="banker" href="#banker"><i data-lucide="shield"></i><span>Banker’s Algorithm</span></a>
        <a class="nav-link" data-route="deadlock" href="#deadlock"><i data-lucide="octagon-alert"></i><span>Deadlock Detection</span></a>
        <a class="nav-link" data-route="rag" href="#rag"><i data-lucide="share-2"></i><span>Allocation Graph</span></a>
        <p class="nav-label">System</p>
        <a class="nav-link" data-route="history" href="#history"><i data-lucide="history"></i><span>History &amp; Logs</span></a>
        <a class="nav-link" data-route="settings" href="#settings"><i data-lucide="settings-2"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="connection-badge"><span id="connection-dot" class="status-dot offline"></span><div><strong id="connection-label">API not configured</strong><small>Backend connection</small></div></div>
        <button id="collapse-sidebar" class="collapse-button"><i data-lucide="panel-left-close"></i><span>Collapse sidebar</span></button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button id="menu-button" class="icon-button mobile-only" aria-label="Open navigation"><i data-lucide="menu"></i></button>
        <div class="breadcrumb"><span id="breadcrumb-section">Overview</span><i data-lucide="chevron-right"></i><strong id="breadcrumb-page">Dashboard</strong></div>
        <div class="topbar-actions">
          <label class="search-box"><i data-lucide="search"></i><input id="global-search" type="search" placeholder="Search anything"><kbd>⌘ K</kbd></label>
          <button id="theme-toggle" class="icon-button" aria-label="Toggle theme"><i data-lucide="sun"></i></button>
          <button id="notification-button" class="icon-button notification-button" aria-label="Notifications"><i data-lucide="bell"></i><span></span></button>
          <div class="profile"><div class="avatar">SS</div><div class="profile-copy"><strong>System Admin</strong><small>Operator</small></div><i data-lucide="chevron-down"></i></div>
        </div>
      </header>
      <section id="view" class="page-content"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
